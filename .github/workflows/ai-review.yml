name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # 1) Check out the PR HEAD (works for same-repo and forks)
      - name: Checkout PR head repo/commit
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # 2) Ensure the BASE commit exists locally (important for forks)
      - name: Fetch base commit from upstream
        run: |
          git remote add upstream https://github.com/${{ github.repository }}.git
          git fetch --no-tags --prune --depth=1 upstream ${{ github.event.pull_request.base.sha }}

      # 3) Python setup + deps
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements.txt

      # 4) Run the reviewer
      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          MODEL_NAME: gpt-4o-mini
          CONFIDENCE_MIN: "0.4"
        run: python .github/ai_review.py
